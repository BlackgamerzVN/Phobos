;==========================================================
; Notes on Size Values (for reference)
;==========================================================
; Typical Size values in vanilla YR:
; - Infantry: Size=1 (most infantry)
; - Light Vehicles: Size=5-10 (Grizzly, Flak Track, etc.)
; - Medium Tanks: Size=10-15 (Rhino, Lasher, etc.)
; - Heavy Tanks: Size=15-25 (Apocalypse, Battle Fortress)
; - Harvesters: Size=20+
;
; Adjust SizeLimit based on your mod's Size values.
;==========================================================

;==========================================================
; Tips for Balancing
;==========================================================
; 1. Speed Penalty: 
;    - Light cargo: 0.85-0.95 (5-15% slower)
;    - Medium cargo: 0.7-0.85 (15-30% slower)
;    - Heavy cargo: 0.5-0.7 (30-50% slower)
;
; 2. Pickup Range:
;    - Default: 256 leptons (~1 cell)
;    - Generous: 384-512 leptons (~1.5-2 cells)
;    - Precise: 128-192 leptons (~0.5-0.75 cells)
;
; 3. Cost Balance:
;    - Infantry-only: 600-1000
;    - Light vehicles: 1000-1500
;    - Heavy vehicles: 1500-2500
;
; 4. Counters:
;    - Low armor (usually "light")
;    - Moderate to low speed
;    - No weapons (defenseless)
;    - Consider adding flak resistance or ECM
;==========================================================
