;==========================================================
; Jumpjet Vehicle Carryall System - Example Configurations
;==========================================================
; These examples demonstrate various use cases for the jumpjet
; carryall system in Phobos. Add these to your rulesmd.ini.
;
; Requires: Phobos extension
; Compatible with: Ares (both systems can coexist)
;==========================================================

;==========================================================
; Example 1: Basic Cargo Helicopter
;==========================================================
; A general-purpose transport copter that can carry both
; infantry and light vehicles, with a reasonable speed penalty.
;==========================================================

[CARGOHELI]
UIName=Name:Cargo Helicopter
Name=Cargo Helicopter
Prerequisite=RADAR
TechLevel=5
Sight=8
Speed=14
Cost=1200
Category=Transport
Primary=None
Secondary=None
Strength=800
Armor=light
TechLevel=5
Points=25
Owner=British,Americans,Alliance,Russians,Confederation,Africans,Arabs
JumpJet=yes
BalloonHover=yes
Landable=no
ROT=5
Crusher=no
Sensors=no
Selectable=yes
MoveToShroud=yes
Trainable=no

; Jumpjet Carryall Configuration
JumpjetCarryall=yes
JumpjetCarryall.SizeLimit=10                ; Can carry infantry and light vehicles (Size <= 10)
JumpjetCarryall.AllowInfantry=yes
JumpjetCarryall.AllowVehicles=yes
JumpjetCarryall.Capacity=1
JumpjetCarryall.PickupRange=256             ; ~1 cell pickup range
JumpjetCarryall.SpeedMultiplier=0.75        ; 25% slower when carrying cargo
JumpjetCarryall.VoicePickup=AlliedVehicleMove
JumpjetCarryall.VoiceDropoff=AlliedVehicleMove

VoiceSelect=AlliedVehicleSelect
VoiceMove=AlliedVehicleMove
VoiceDie=GenericVehicleDie

;==========================================================
; Example 2: Medical Evacuation Helicopter (Infantry Only)
;==========================================================
; A specialized medevac copter that only picks up infantry,
; optimized for quick extraction with minimal speed loss.
;==========================================================

[MEDEVAC]
UIName=Name:Medevac Helicopter
Name=Medevac Helicopter
Prerequisite=BARRACKS,RADAR
TechLevel=3
Sight=8
Speed=16
Cost=800
Category=Transport
Primary=None
Secondary=None
Strength=600
Armor=light
Points=15
Owner=British,Americans,Alliance
JumpJet=yes
BalloonHover=yes
Landable=no
ROT=6
Crusher=no
Sensors=no

; Infantry-only medical evacuation
JumpjetCarryall=yes
JumpjetCarryall.SizeLimit=5                 ; Infantry only (Size <= 5)
JumpjetCarryall.AllowInfantry=yes
JumpjetCarryall.AllowVehicles=no            ; Cannot carry vehicles
JumpjetCarryall.Capacity=1
JumpjetCarryall.PickupRange=320             ; Larger pickup range (~1.25 cells)
JumpjetCarryall.SpeedMultiplier=0.9         ; Only 10% slower when loaded
JumpjetCarryall.VoicePickup=AlliedVehicleMove

VoiceSelect=AlliedVehicleSelect
VoiceMove=AlliedVehicleMove

;==========================================================
; Example 3: Heavy Tank Transport (Size & Type Restricted)
;==========================================================
; A powerful transport that can only lift heavy vehicles
; like tanks, with significant speed penalty when loaded.
;==========================================================

[TANKTRANS]
UIName=Name:Heavy Lifter
Name=Heavy Lifter
Prerequisite=WARFACT,RADAR
TechLevel=7
Sight=8
Speed=10
Cost=2000
Category=Transport
Primary=None
Secondary=None
Strength=1200
Armor=medium
Points=30
Owner=Americans,Alliance
JumpJet=yes
BalloonHover=yes
Landable=no
ROT=4
Crusher=no
Sensors=no

; Heavy vehicle transport with type restrictions
JumpjetCarryall=yes
JumpjetCarryall.SizeLimit=25                ; Heavy units (Size <= 25)
JumpjetCarryall.AllowInfantry=no            ; Vehicles only
JumpjetCarryall.AllowVehicles=yes
JumpjetCarryall.Types=TNKT,MTNK,HTNK,APOC,CTNK  ; Only specific tank types
JumpjetCarryall.Capacity=1
JumpjetCarryall.PickupRange=256
JumpjetCarryall.SpeedMultiplier=0.6         ; 40% slower when carrying heavy cargo
JumpjetCarryall.VoicePickup=AlliedVehicleMove
JumpjetCarryall.VoiceDropoff=AlliedVehicleMove

VoiceSelect=AlliedVehicleSelect
VoiceMove=AlliedVehicleMove
VoiceDie=GenericVehicleDie

